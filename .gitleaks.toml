# Secret scanning runs in CI (see .github/workflows/ci.yml).
# Default rules stay enabled; anything credential-shaped fails the build.

[extend]
useDefault = true

[[allowlists]]
description = """
Paystack publishable key in the React bundle (client/src/pages/CustomDomains.tsx).
Publishable keys are designed to be embedded in browser code and are not secrets.
The allowlist is scoped to that file and to the pk_ prefix only, so any secret
key (sk_live_/sk_test_) added to the same file still fails the scan.
"""
paths = ['''^client/src/pages/CustomDomains\.tsx$''']
regexes = ['''pk_live_[0-9a-f]{40}''']

[[allowlists]]
description = """
Exact fake credentials used by tests and CI. These values are deliberately not
usable secrets: they exist so config validation tests and the CI job have a
JWT_SECRET of the required length. Matching is by literal value only, so any
other secret-shaped string in the same files still fails the scan.
"""
regexTarget = "match"
regexes = [
  '''k3Y-8f3a1c9b7d2e4f6a0c5b8d1e3f7a9c2bQ''',
  '''ci-4f9c2a7b1e8d3f6a0b5c9e2d7a4f1b8c''',
  '''argon2-placeholder''',
  '''sk_test_vela_fixture_not_a_real_key''',
]
